<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Phone Emulator Portal</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Top Bar: Device Selector & Auto DNS -->
    <header class="w-full max-w-4xl bg-slate-800 p-4 rounded-xl shadow-lg mb-6 flex flex-wrap justify-between items-center gap-4">
        <!-- Device Manager -->
        <div class="flex items-center space-x-2">
            <label for="device-select" class="text-sm text-slate-400">Active Device Profile:</label>
            <select id="device-select" onchange="switchDevice()" class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-emerald-500">
                <!-- Profiles will be injected via JS -->
            </select>
            <button onclick="createNewDevice()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-md flex items-center gap-1 font-semibold transition">
                <i class="fa-solid fa-plus"></i> New Device
            </button>
        </div>

        <!-- Region / DNS Selector -->
        <div class="flex items-center space-x-2">
            <span class="text-sm font-medium mr-2"><i class="fa-solid fa-network-wired text-emerald-400"></i> DNS: <strong id="dns-status" class="text-emerald-400">Auto</strong></span>
            <select id="country" onchange="updateDNS()" class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-emerald-500">
                <option value="us">United States (IP: 192.0.2.1)</option>
                <option value="uk">United Kingdom (IP: 198.51.100.1)</option>
                <option value="sg">Singapore (IP: 203.0.113.1)</option>
                <option value="de">Germany (IP: 212.58.244.1)</option>
            </select>
        </div>
    </header>

    <!-- Main Emulator Container -->
    <main class="w-full max-w-sm bg-black rounded-[40px] p-3 shadow-2xl border-4 border-slate-700 relative flex flex-col items-center">
        <!-- Phone Speaker / Camera Notch -->
        <div class="w-32 h-4 bg-slate-800 rounded-full mb-3 flex items-center justify-center">
            <div class="w-3 h-3 bg-slate-900 rounded-full"></div>
        </div>

        <!-- Phone Screen / Display Area -->
        <div class="w-full h-[550px] bg-slate-950 rounded-[30px] overflow-hidden flex flex-col justify-between relative border border-slate-800">
            
            <!-- Status Bar -->
            <div class="bg-slate-900/90 px-4 py-2 flex justify-between items-center text-xs text-slate-300 z-10">
                <span id="current-time">11:13 PM</span>
                <div class="flex items-center space-x-2">
                    <span id="device-name-display" class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-emerald-400">Device 1</span>
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-battery-full text-emerald-400"></i>
                </div>
            </div>

            <!-- Home Screen App Grid -->
            <div id="home-screen" class="p-6 grid grid-cols-3 gap-6 flex-grow content-start z-10">
                <!-- Play Store App -->
                <button onclick="openApp('playstore')" class="flex flex-col items-center group focus:outline-none">
                    <div class="w-14 h-14 bg-gradient-to-tr from-emerald-600 to-teal-400 rounded-2xl flex items-center justify-center shadow-md group-hover:scale-105 transition">
                        <i class="fa-solid fa-play text-2xl text-white"></i>
                    </div>
                    <span class="text-[11px] mt-1 text-slate-300">Play Store</span>
                </button>

                <!-- Browser App -->
                <button onclick="openApp('browser')" class="flex flex-col items-center group focus:outline-none">
                    <div class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-cyan-400 rounded-2xl flex items-center justify-center shadow-md group-hover:scale-105 transition">
                        <i class="fa-solid fa-globe text-2xl text-white"></i>
                    </div>
                    <span class="text-[11px] mt-1 text-slate-300">Browser</span>
                </button>

                <!-- Settings App -->
                <button onclick="openApp('settings')" class="flex flex-col items-center group focus:outline-none">
                    <div class="w-14 h-14 bg-gradient-to-tr from-slate-600 to-slate-500 rounded-2xl flex items-center justify-center shadow-md group-hover:scale-105 transition">
                        <i class="fa-solid fa-gear text-2xl text-white"></i>
                    </div>
                    <span class="text-[11px] mt-1 text-slate-300">Settings</span>
                </button>
            </div>

            <!-- Internal App View / Modal -->
            <div id="app-view" class="absolute inset-0 bg-slate-900 hidden flex flex-col z-20">
                <div class="bg-slate-800 px-4 py-3 flex justify-between items-center border-b border-slate-700">
                    <span id="app-title" class="text-xs font-semibold text-white">App</span>
                    <button onclick="closeApp()" class="text-slate-400 hover:text-white text-sm px-2 py-1"><i class="fa-solid fa-xmark"></i> Close</button>
                </div>
                <div id="app-content" class="flex-grow flex flex-col items-center justify-center p-4 text-center overflow-y-auto">
                    <!-- Dynamic Content -->
                </div>
            </div>

            <!-- Navigation Bar -->
            <div class="bg-slate-900 py-3 flex justify-around items-center text-slate-400 text-sm z-10">
                <i class="fa-solid fa-chevron-left cursor-pointer hover:text-white" onclick="closeApp()"></i>
                <i class="fa-solid fa-circle cursor-pointer hover:text-white" onclick="closeApp()"></i>
                <i class="fa-solid fa-square cursor-pointer hover:text-white"></i>
            </div>
        </div>

        <!-- Phone Home Button Bar -->
        <div class="w-28 h-1 bg-slate-600 rounded-full mt-3"></div>
    </main>

    <footer class="mt-6 text-center text-xs text-slate-500">
        <p>Auto-saved local device profiles. Multi-instance support active.</p>
    </footer>

    <!-- JavaScript Logic for LocalStorage Persistence & Device Switching -->
    <script>
        // Default State Configuration
        let devices = JSON.parse(localStorage.getItem('emu_devices')) || [
            { id: 'dev_1', name: 'Device Profile 1', region: 'us', account: '' }
        ];
        let activeDeviceId = localStorage.getItem('emu_active_device') || 'dev_1';

        // Initialize UI
        document.addEventListener('DOMContentLoaded', () => {
            renderDeviceDropdown();
            loadActiveDevice();
            updateTime();
            setInterval(updateTime, 1000);
        });

        // Live Clock
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('current-time').innerText = `${hours}:${minutes} ${ampm}`;
        }

        // Render Device Dropdown Options
        function renderDeviceDropdown() {
            const select = document.getElementById('device-select');
            select.innerHTML = '';
            devices.forEach(dev => {
                const opt = document.createElement('option');
                opt.value = dev.id;
                opt.innerText = dev.name;
                if (dev.id === activeDeviceId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        // Switch Active Device Profile
        function switchDevice() {
            activeDeviceId = document.getElementById('device-select').value;
            localStorage.setItem('emu_active_device', activeDeviceId);
            loadActiveDevice();
        }

        // Load Active Device Settings
        function loadActiveDevice() {
            const currentDev = devices.find(d => d.id === activeDeviceId) || devices[0];
            document.getElementById('device-name-display').innerText = currentDev.name;
            document.getElementById('country').value = currentDev.region;
            updateDNSStatus(currentDev.region);
        }

        // Create New Virtual Device
        function createNewDevice() {
            const newId = 'dev_' + Date.now();
            const newName = 'Device Profile ' + (devices.length + 1);
            const newDev = { id: newId, name: newName, region: 'us', account: '' };
            
            devices.push(newDev);
            activeDeviceId = newId;
            
            localStorage.setItem('emu_devices', JSON.stringify(devices));
            localStorage.setItem('emu_active_device', activeDeviceId);
            
            renderDeviceDropdown();
            loadActiveDevice();
            alert(`${newName} created and loaded successfully!`);
        }

        // Region / DNS Update Logic
        function updateDNS() {
            const region = document.getElementById('country').value;
            const currentDev = devices.find(d => d.id === activeDeviceId);
            if (currentDev) {
                currentDev.region = region;
                localStorage.setItem('emu_devices', JSON.stringify(devices));
            }
            updateDNSStatus(region);
        }

        function updateDNSStatus(region) {
            const statusEl = document.getElementById('dns-status');
            statusEl.innerText = `Connecting (${region.toUpperCase()})...`;
            setTimeout(() => {
                statusEl.innerText = `${region.toUpperCase()} Active`;
            }, 400);
        }

        // App View Handler
        function openApp(appName) {
            const appView = document.getElementById('app-view');
            const appTitle = document.getElementById('app-title');
            const appContent = document.getElementById('app-content');
            const currentDev = devices.find(d => d.id === activeDeviceId);

            appView.classList.remove('hidden');

            if (appName === 'playstore') {
                appTitle.innerText = "Google Play Sandbox";
                appContent.innerHTML = `
                    <div class="space-y-3 w-full">
                        <div class="bg-emerald-600 text-white p-3 rounded-xl font-bold text-sm">Google Account Setup</div>
                        <p class="text-xs text-slate-300">Active Profile: <strong>${currentDev.name}</strong></p>
                        <input id="acc-input" type="email" value="${currentDev.account || ''}" placeholder="Enter Google Account Email" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs text-white focus:outline-none">
                        <button onclick="saveAccount()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded text-xs font-semibold">Save Profile & Login</button>
                    </div>
                `;
            } else if (appName === 'browser') {
                appTitle.innerText = "Internal Browser";
                appContent.innerHTML = `
                    <div class="w-full h-full flex flex-col space-y-2">
                        <div class="flex items-center bg-slate-800 rounded p-1">
                            <i class="fa-solid fa-lock text-emerald-400 text-xs px-2"></i>
                            <span class="text-[11px] text-slate-300 truncate">https://www.google.com</span>
                        </div>
                        <div class="flex-grow bg-white text-black rounded p-2 text-xs flex items-center justify-center font-medium">
                            Isolated Profile Session (${currentDev.name})
                        </div>
                    </div>
                `;
            } else if (appName === 'settings') {
                appTitle.innerText = "Device Config";
                appContent.innerHTML = `
                    <div class="w-full text-left space-y-3 text-xs">
                        <div class="bg-slate-800 p-2.5 rounded">
                            <span class="text-slate-400 block">Device Identifier:</span>
                            <strong class="text-emerald-400">${currentDev.id}</strong>
                        </div>
                        <div class="bg-slate-800 p-2.5 rounded">
                            <span class="text-slate-400 block">Saved Google Account:</span>
                            <strong class="text-blue-400">${currentDev.account || 'None Linked'}</strong>
                        </div>
                        <button onclick="deleteDevice()" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-2 rounded font-semibold">Delete This Profile</button>
                    </div>
                `;
            }
        }

        // Save Account Info to LocalStorage
        function saveAccount() {
            const accVal = document.getElementById('acc-input').value;
            const currentDev = devices.find(d => d.id === activeDeviceId);
            if (currentDev) {
                currentDev.account = accVal;
                localStorage.setItem('emu_devices', JSON.stringify(devices));
                alert('Account saved for ' + currentDev.name);
            }
        }

        // Delete Profile Option
        function deleteDevice() {
            if (devices.length <= 1) {
                alert('You must keep at least one device profile!');
                return;
            }
            devices = devices.filter(d => d.id !== activeDeviceId);
            activeDeviceId = devices[0].id;
            localStorage.setItem('emu_devices', JSON.stringify(devices));
            localStorage.setItem('emu_active_device', activeDeviceId);
            closeApp();
            renderDeviceDropdown();
            loadActiveDevice();
        }

        function closeApp() {
            document.getElementById('app-view').classList.add('hidden');
        }
    </script>
</body>
</html>
