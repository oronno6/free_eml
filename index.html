<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Phone Emulator Portal</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Top Bar: Auto DNS & Country Selector -->
    <header class="w-full max-w-4xl bg-slate-800 p-4 rounded-xl shadow-lg mb-6 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-500 w-3 h-3 rounded-full animate-pulse"></div>
            <span class="text-sm font-medium">DNS Status: <strong id="dns-status" class="text-emerald-400">Auto-Configured</strong></span>
        </div>
        
        <div class="flex items-center space-x-2">
            <label for="country" class="text-sm text-slate-400">Select Region:</label>
            <select id="country" onchange="updateDNS()" class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-emerald-500">
                <option value="us">United States (Cloud DNS)</option>
                <option value="uk">United Kingdom (Cloud DNS)</option>
                <option value="sg">Singapore (Cloud DNS)</option>
                <option value="de">Germany (Cloud DNS)</option>
            </select>
        </div>
    </header>

    <!-- Main Emulator Container -->
    <main class="w-full max-w-sm bg-black rounded-[40px] p-3 shadow-2xl border-4 border-slate-700 relative flex flex-col items-center">
        <!-- Phone Speaker / Camera Notch -->
        <div class="w-32 h-4 bg-slate-800 rounded-full mb-3 flex items-center justify-center">
            <div class="w-3 h-3 bg-slate-900 rounded-full"></div>
        </div>

        <!-- Phone Screen / Display Area -->
        <div class="w-full h-[550px] bg-slate-950 rounded-[30px] overflow-hidden flex flex-col justify-between relative border border-slate-800">
            
            <!-- Status Bar -->
            <div class="bg-slate-900/80 px-4 py-2 flex justify-between items-center text-xs text-slate-300">
                <span id="current-time">9:41 AM</span>
                <div class="flex space-x-2">
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-battery-full text-emerald-400"></i>
                </div>
            </div>

            <!-- App Grid / Play Store Area -->
            <div class="p-6 grid grid-cols-3 gap-6 flex-grow content-start">
                <!-- Play Store Shortcut -->
                <a href="https://play.google.com/store" target="_blank" class="flex flex-col items-center group">
                    <div class="w-14 h-14 bg-gradient-to-tr from-emerald-600 to-teal-400 rounded-2xl flex items-center justify-center shadow-md group-hover:scale-105 transition">
                        <i class="fa-brands. fa-google-play text-2xl text-white"></i>
                        <span class="sr-only">Play Store</span>
                    </div>
                    <span class="text-[11px] mt-1 text-slate-300">Play Store</span>
                </a>

                <!-- Browser App -->
                <a href="https://www.google.com" target="_blank" class="flex flex-col items-center group">
                    <div class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-cyan-400 rounded-2xl flex items-center justify-center shadow-md group-hover:scale-105 transition">
                        <i class="fa-solid fa-globe text-2xl text-white"></i>
                    </div>
                    <span class="text-[11px] mt-1 text-slate-300">Browser</span>
                </a>

                <!-- Settings App -->
                <onclick="alert('Profile settings loaded with auto-DNS!')" class="flex flex-col items-center group cursor-pointer">
                    <div class="w-14 h-14 bg-gradient-to-tr from-slate-600 to-slate-500 rounded-2xl flex items-center justify-center shadow-md group-hover:scale-105 transition">
                        <i class="fa-solid fa-gear text-2xl text-white"></i>
                    </div>
                    <span class="text-[11px] mt-1 text-slate-300">Settings</span>
                </onclick>
            </div>

            <!-- Navigation Bar (Android style) -->
            <div class="bg-slate-900 py-3 flex justify-around items-center text-slate-400 text-sm">
                <i class="fa-solid fa-chevron-left cursor-pointer hover:text-white"></i>
                <i class="fa-solid fa-circle cursor-pointer hover:text-white"></i>
                <i class="fa-solid fa-square cursor-pointer hover:text-white"></i>
            </div>
        </div>

        <!-- Phone Home Button Bar -->
        <div class="w-28 h-1 bg-slate-600 rounded-full mt-3"></div>
    </main>

    <!-- Footer Instructions -->
    <footer class="mt-6 text-center text-xs text-slate-500">
        <p>No account required. Region DNS auto-switches securely on selection.</p>
    </footer>

    <!-- JavaScript for Dynamic Interactions -->
    <script>
        // Update live clock
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0'+minutes : minutes;
            document.getElementById('current-time').innerText = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Handle Region & Auto DNS Simulation
        function updateDNS() {
            const country = document.getElementById('country').value;
            const statusEl = document.getElementById('dns-status');
            statusEl.innerText = `Connecting via ${country.toUpperCase()} DNS...`;
            
            setTimeout(() => {
                statusEl.innerText = `Auto-Configured (${country.toUpperCase()})`;
            }, 600);
        }
    </script>
</body>
</html>
