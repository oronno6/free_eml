
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d19">
<title>CloudPhone Emulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:white;font-family:Arial,sans-serif}
.phone{width:370px;height:760px;max-width:96vw;max-height:94dvh;
 padding:9px;border:7px solid #343b49;border-radius:43px;
 background:#05070c;box-shadow:0 25px 90px #000b;position:relative}
.screen{height:100%;border-radius:29px;overflow:hidden;
 background:#101827;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;z-index:20;top:0;left:50%;transform:translateX(-50%);
 width:110px;height:23px;background:#05070c;border-radius:0 0 16px 16px}
.status{height:35px;min-height:35px;padding:7px 17px;
 display:flex;justify-content:space-between;font-size:11px;font-weight:bold}
.viewport{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#475569 transparent}
.nav{height:48px;min-height:48px;background:#080d17;
 border-top:1px solid #293548;display:flex;align-items:center;justify-content:space-around}
.nav button{width:33%;height:100%;font-size:21px;color:#dbeafe}
.appicon{height:58px;width:58px;border-radius:17px;display:grid;
 place-items:center;font-size:28px;margin:auto;box-shadow:0 4px 14px #0005}
.tile{text-align:center;cursor:pointer;min-width:75px}
.tile p{font-size:11px;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:#1a293d;border:1px solid #304158;border-radius:14px;padding:13px}
.field{width:100%;background:#0b1423;border:1px solid #394b64;
 border-radius:10px;padding:11px;color:white;outline:none;font-size:13px}
.field:focus{border-color:#3b82f6}
.btn{background:#2563eb;color:white;padding:10px 14px;border-radius:9px;
 font-size:12px;font-weight:bold}
.btn2{background:#304158;color:white;padding:10px 14px;border-radius:9px;font-size:12px}
.muted{font-size:11px;color:#94a3b8}
.progress{height:7px;background:#334155;border-radius:10px;overflow:hidden}
.progress>div{height:100%;width:0;background:#38bdf8;transition:width .15s}
.item{display:flex;align-items:center;gap:12px;padding:12px;
 border-bottom:1px solid #334155}
.item:last-child{border:0}
.hidden{display:none!important}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
 background:#2563eb;padding:11px 18px;border-radius:12px;font-size:12px;
 z-index:100;white-space:nowrap}
iframe{width:100%;height:100%;border:0;background:white}
.preview{max-width:100%;max-height:420px;object-fit:contain}
</style>
</head>
<body>
<main class="min-h-screen flex items-center justify-center p-2">
 <div class="phone">
  <div class="screen">
   <div class="notch"></div>
   <div class="status">
    <span id="clock">12:00</span>
    <span>● ▰ ▣ 100%</span>
   </div>
   <div id="view" class="viewport"></div>
   <div class="nav">
    <button onclick="back()">‹</button>
    <button onclick="home()">●</button>
    <button onclick="recent()">▣</button>
   </div>
  </div>
 </div>
</main>
<div id="toast" class="hidden"></div>

<script>
"use strict";

/* CLOUDPHONE LOCAL ENVIRONMENT */

const KEY="cloudphone_v3";
const DB="CloudPhoneFiles";
let state=load();
let page="home",stack=[],recentPages=[];
let timers={};
let objectUrls=[];

function id(){
 return "app_"+Math.random().toString(36).slice(2,10);
}
function load(){
 try{
  let x=JSON.parse(localStorage.getItem(KEY));
  if(x&&x.devices?.length)return x;
 }catch(e){}
 let d={id:id(),name:"My Cloud Phone",region:"US",email:"",
  apps:[],files:[],history:[]};
 return {active:d.id,devices:[d]};
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(state))}
 catch(e){notify("Storage limit reached")}
}
function dev(){return state.devices.find(x=>x.id===state.active)}
function notify(s){
 let t=document.getElementById("toast");
 t.textContent=s;t.classList.remove("hidden");
 clearTimeout(window._toast);
 window._toast=setTimeout(()=>t.classList.add("hidden"),2300);
}
function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function icon(emoji,color="#2563eb"){
 return `<div class="appicon" style="background:${color}">${emoji}</div>`;
}
function tile(emoji,name,action,color){
 return `<div class="tile" onclick="${action}">
 ${icon(emoji,color)}<p>${esc(name)}</p></div>`;
}
function go(p){
 if(page!==p){stack.push(page);recentPages.unshift(page);
 recentPages=[...new Set(recentPages)].slice(0,8)}
 page=p;render();
}
function home(){stack=[];page="home";render()}
function back(){
 if(stack.length){page=stack.pop();render()}
 else home();
}
function recent(){go("recent")}
function render(){
 const v=document.getElementById("view");
 const routes={
  home:homeView,store:storeView,signin:signinView,
  files:filesView,settings:settingsView,
  browser:browserView,recent:recentView
 };
 if(page.startsWith("file:"))v.innerHTML=fileView(page.slice(5));
 else if(page.startsWith("app:"))v.innerHTML=appView(page.slice(4));
 else v.innerHTML=(routes[page]||homeView)();
 if(page==="files")bindFiles();
}
function homeView(){
 let d=dev();
 let builtin=[
  tile("▶️","Play Store","openStore()","#2563eb"),
  tile("🌐","Browser","go('browser')","#0284c7"),
  tile("📁","File Manager","go('files')","#b45309"),
  tile("⚙️","Settings","go('settings')","#475569")
 ];
 let installed=d.apps.map(a=>tile(a.icon||"📦",a.name,
  `launch('${a.id}')`,a.color||"#6d28d9"));
 return `<div class="p-4 pt-9 min-h-full" style="background:
 linear-gradient(160deg,#152744,#101827 65%)">
  <div class="text-center pt-8 pb-9">
   <div class="text-5xl mb-3">☁️</div>
   <h1 class="text-2xl font-bold">CloudPhone</h1>
   <p class="muted mt-2">${esc(d.name)} · ${d.region}</p>
   <p class="text-xs text-slate-400 mt-1" id="homeDate"></p>
  </div>
  <div class="grid grid-cols-4 gap-y-8 gap-x-1">${builtin.join("")}</div>
  ${installed.length?`
   <div class="mt-9">
    <h3 class="text-xs text-slate-300 mb-5 font-bold">INSTALLED APPS</h3>
    <div class="grid grid-cols-4 gap-y-7">${installed.join("")}</div>
   </div>`:""}
  <div class="mt-12 text-center">
   <p class="muted">Your personal virtual device</p>
  </div>
 </div>`;
}

/* STORE - LOCAL DEMO CATALOG */

const catalog=[
 {id:"whatsapp",name:"WhatsApp",icon:"💬",color:"#168b51",size:25,
  category:"Communication",description:"A simulated messaging application."},
 {id:"youtube",name:"YouTube",icon:"▶️",color:"#dc2626",size:35,
  category:"Video",description:"A demo video browsing application."},
 {id:"telegram",name:"Telegram",icon:"✈️",color:"#0284c7",size:20,
  category:"Communication",description:"A simulated messaging application."},
 {id:"freefire",name:"Free Fire",icon:"🔥",color:"#c2410c",size:80,
  category:"Games",description:"A demo game launcher."},
 {id:"pubg",name:"PUBG Mobile",icon:"🎮",color:"#a16207",size:100,
  category:"Games",description:"A demo game launcher."},
 {id:"calculator",name:"Calculator",icon:"🧮",color:"#475569",size:5,
  category:"Tools",description:"A functional calculator."},
 {id:"notes",name:"Notes",icon:"📝",color:"#ca8a04",size:5,
  category:"Productivity",description:"A local notes application."}
];

function openStore(){
 go(dev().email?"store":"signin");
}
function signinView(){
 return `<div class="p-5 pt-12">
  <div class="text-center mb-7">
   <div class="text-5xl">▶️</div>
   <h2 class="text-2xl font-bold mt-4">Play Store</h2>
   <p class="muted mt-2">Demo account sign-in</p>
  </div>
  <div class="card space-y-4">
   <h3 class="font-bold">Welcome</h3>
   <p class="muted">Enter an email to create a local demo profile. This is not Google Sign-In.</p>
   <input id="email" class="field" type="email" placeholder="Email address">
   <button class="btn w-full" onclick="login()">Continue</button>
   <button class="btn2 w-full" onclick="home()">Cancel</button>
  </div>
 </div>`;
}
function login(){
 let e=document.getElementById("email").value.trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){
  notify("Enter a valid email");return;
 }
 dev().email=e;save();page="store";render();
}
function storeView(){
 return `<div class="p-4 pt-7">
  <div class="flex justify-between items-center mb-5">
   <div><h2 class="text-xl font-bold">Play Store</h2>
    <p class="muted">Explore apps</p></div>
   <span class="text-2xl">▶️</span>
  </div>
  <div class="card mb-5">
   <p class="muted">Local demo profile</p>
   <p class="text-xs mt-1 break-all">${esc(dev().email)}</p>
   <button class="text-blue-400 text-xs mt-2" onclick="logout()">Sign out</button>
  </div>
  <input class="field mb-4" id="search" placeholder="🔍 Search apps..."
   oninput="filterStore(this.value)">
  <div id="catalogList">${catalog.map(storeItem).join("")}</div>
 </div>`;
}
function storeItem(a){
 let installed=dev().apps.some(x=>x.id===a.id);
 return `<div class="card mb-3">
  <div class="flex gap-3 items-center">
   ${icon(a.icon,a.color)}
   <div class="flex-1 min-w-0">
    <b class="text-sm">${esc(a.name)}</b>
    <p class="muted">${esc(a.category)} · ${a.size} MB</p>
   </div>
   <button class="${installed?"btn2":"btn"}"
    ${installed?"disabled":""}
    onclick="install('${a.id}')">${installed?"Open":"Install"}</button>
  </div>
  <p class="muted mt-3">${esc(a.description)}</p>
  <div id="p-${a.id}" class="hidden mt-3">
   <div class="flex justify-between muted mb-1">
    <span id="s-${a.id}">Downloading...</span>
    <span id="n-${a.id}">0%</span>
   </div>
   <div class="progress"><div id="b-${a.id}"></div></div>
  </div>
 </div>`;
}
function filterStore(q){
 let list=document.getElementById("catalogList");
 let results=catalog.filter(a=>
  (a.name+" "+a.category).toLowerCase().includes(q.toLowerCase()));
 list.innerHTML=results.length?results.map(storeItem).join(""):
  '<p class="muted text-center p-6">No apps found</p>';
}
function logout(){dev().email="";save();page="signin";render()}
function install(id){
 let a=catalog.find(x=>x.id===id);
 if(!a||dev().apps.some(x=>x.id===id))return;
 let p=document.getElementById("p-"+id);
 if(!p)return;
 p.classList.remove("hidden");
 let n=0;
 let button=[...document.querySelectorAll("button")].find(x=>
  x.getAttribute("onclick")===`install('${id}')`);
 if(button)button.disabled=true;
 timers[id]=setInterval(()=>{
  n=Math.min(100,n+Math.ceil(Math.random()*12));
  let bar=document.getElementById("b-"+id);
  if(!bar){clearInterval(timers[id]);return}
  bar.style.width=n+"%";
  document.getElementById("n-"+id).textContent=n+"%";
  if(n>=100){
   clearInterval(timers[id]);
   dev().apps.push({...a});
   save();
   document.getElementById("s-"+id).textContent="Installed";
   if(button){button.textContent="Open";button.disabled=false;
    button.onclick=()=>launch(id);button.removeAttribute("onclick");}
   notify(a.name+" installed");
  }
 },170);
}

/* APP LAUNCHER */

function launch(id){go("app:"+id)}
function appView(id){
 let a=dev().apps.find(x=>x.id===id);
 if(!a)return '<div class="p-5">App not found</div>';
 if(id==="calculator")return calculatorView();
 if(id==="notes")return notesView();
 if(id==="whatsapp"||id==="telegram")return chatView(id);
 if(id==="youtube")return videoAppView();
 if(id==="freefire"||id==="pubg")return gameView(a);
 return `<div class="p-5 pt-10 text-center">
  ${icon(a.icon,a.color)}
  <h2 class="font-bold text-xl mt-4">${esc(a.name)}</h2>
  <p class="muted mt-3">Demo application installed on this device.</p>
  <button class="btn2 mt-5" onclick="home()">Home</button>
 </div>`;
}
function calculatorView(){
 return `<div class="p-4 pt-8">
  <h2 class="font-bold text-xl mb-5">🧮 Calculator</h2>
  <input id="calc" class="field text-right text-2xl mb-3" readonly value="0">
  <div class="grid grid-cols-4 gap-2">
   ${["7","8","9","/","4","5","6","*","1","2","3","-","C","0",".","+","="].map(x=>
    `<button class="card text-xl p-4" onclick="calcKey('${x}')">${x}</button>`).join("")}
  </div>
 </div>`;
}
let calcExpression="";
function calcKey(k){
 let el=document.getElementById("calc");
 if(!el)return;
 if(k==="C")calcExpression="";
 else if(k==="="){
  try{
   if(!/^[0-9+\-*/.() ]+$/.test(calcExpression))throw Error();
   let result=Function('"use strict";return ('+calcExpression+')')();
   calcExpression=Number.isFinite(result)?String(result):"";
  }catch(e){calcExpression=""}
 }else calcExpression+=k;
 el.value=calcExpression||"0";
}
function notesView(){
 return `<div class="p-4 pt-8">
  <h2 class="font-bold text-xl mb-4">📝 Notes</h2>
  <textarea id="notes" class="field" rows="14"
   placeholder="Write your notes here...">${esc(localStorage.getItem("cp_notes_"+dev().id)||"")}</textarea>
  <button class="btn w-full mt-3" onclick="saveNotes()">Save Notes</button>
 </div>`;
}
function saveNotes(){
 localStorage.setItem("cp_notes_"+dev().id,document.getElementById("notes").value);
 notify("Notes saved");
}
function chatView(id){
 let key="cp_chat_"+dev().id+"_"+id;
 let messages=[];
 try{messages=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}
 return `<div class="p-4 pt-7">
  <h2 class="font-bold text-xl mb-4">${id==="whatsapp"?"💬 WhatsApp Demo":"✈️ Telegram Demo"}</h2>
  <p class="muted mb-3">Local simulated chat. No real messages are sent.</p>
  <div class="card min-h-72 mb-3 space-y-3" id="messages">
   ${messages.map(m=>`<div class="text-sm p-2 rounded-lg bg-slate-700">${esc(m)}</div>`).join("")}
  </div>
  <div class="flex gap-2">
   <input id="chatText" class="field" placeholder="Type a message...">
   <button class="btn" onclick="sendChat('${id}')">Send</button>
  </div>
 </div>`;
}
function sendChat(id){
 let input=document.getElementById("chatText");
 let text=input.value.trim();if(!text)return;
 let key="cp_chat_"+dev().id+"_"+id;
 let a=[];try{a=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}
 a.push(text);localStorage.setItem(key,JSON.stringify(a));
 render();
}
function videoAppView(){
 return `<div class="p-4 pt-8">
  <h2 class="font-bold text-xl mb-4">▶️ Video Demo</h2>
  <div class="card text-center py-12">
   <div class="text-5xl">🎬</div>
   <p class="font-bold mt-4">Video Library</p>
   <p class="muted mt-2">Import videos in File Manager to play them.</p>
   <button class="btn mt-4" onclick="go('files')">Open Files</button>
  </div>
 </div>`;
}
function gameView(a){
 return `<div class="p-5 pt-12 text-center">
  ${icon(a.icon,a.color)}
  <h2 class="font-bold text-xl mt-5">${esc(a.name)}</h2>
  <p class="muted mt-3">Game launcher demo</p>
  <div class="card mt-5 py-10">
   <div class="text-4xl">🎮</div>
   <p class="text-sm mt-3">Android game runtime is not included.</p>
  </div>
 </div>`;
}

/* FILE STORAGE - INDEXEDDB */

let dbPromise;
function db(){
 if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{
  let r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>{
   if(!r.result.objectStoreNames.contains("files"))
    r.result.createObjectStore("files",{keyPath:"id"});
  };
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
 return dbPromise;
}
async function dbPut(file){
 let database=await db();
 return new Promise((resolve,reject)=>{
  let tx=database.transaction("files","readwrite");
  tx.objectStore("files").put(file);
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });
}
async function dbGet(id){
 let database=await db();
 return new Promise((resolve,reject)=>{
  let tx=database.transaction("files","readonly");
  let r=tx.objectStore("files").get(id);
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}
async function dbDelete(id){
 let database=await db();
 return new Promise((resolve,reject)=>{
  let tx=database.transaction("files","readwrite");
  tx.objectStore("files").delete(id);
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });
}
function filesView(){
 return `<div class="p-4 pt-8">
  <h2 class="font-bold text-xl mb-2">📁 File Manager</h2>
  <p class="muted mb-5">Import files from your device.</p>
  <div class="card space-y-3">
   <div class="text-center text-4xl">📂</div>
   <input id="filePicker" class="field" type="file" multiple>
   <p class="muted">APK · MP4 · MP3 · PDF · TXT · DOC · JPG · PNG and other files</p>
   <button class="btn w-full" onclick="document.getElementById('filePicker').click()">+ Add Files</button>
   <p class="muted">Files remain in this browser using IndexedDB.</p>
  </div>
  <div class="flex justify-between mt-6 mb-3">
   <h3 class="font-bold">My Files</h3>
   <span class="muted">${dev().files.length} files</span>
  </div>
  <div id="fileList" class="card p-1">
   ${dev().files.length?dev().files.map(fileRow).join(""):'<p class="muted p-4">No files imported yet.</p>'}
  </div>
 </div>`;
}
function fileRow(f){
 return `<div class="item">
  <div class="text-2xl">${fileEmoji(f.name)}</div>
  <div class="flex-1 min-w-0">
   <p class="text-xs font-bold truncate">${esc(f.name)}</p>
   <p class="muted">${f.sizeText} · ${esc(f.type)}</p>
  </div>
  <button class="text-blue-400 text-xs" onclick="openFile('${f.id}')">Open</button>
 </div>`;
}
function fileEmoji(n){
 let x=n.split(".").pop().toLowerCase();
 return ({apk:"📦",mp4:"🎬",mov:"🎬",mp3:"🎵",wav:"🎵",
 pdf:"📕",txt:"📄",doc:"📄",docx:"📄",jpg:"🖼️",jpeg:"🖼️",
 png:"🖼️",webp:"🖼️",zip:"🗜️"})[x]||"📁";
}
function bindFiles(){
 let input=document.getElementById("filePicker");
 input.onchange=async()=>{
  let files=[...input.files];
  for(let f of files){
   let fid=id();
   let meta={id:fid,name:f.name,size:f.size,type:f.type||"Unknown",
    sizeText:formatSize(f.size)};
   try{
    await dbPut({id:fid,device:dev().id,blob:f,name:f.name,type:f.type});
    dev().files.push(meta);
   }catch(e){notify("Could not save "+f.name)}
  }
  save();render();notify(files.length+" file(s) imported");
 };
}
function formatSize(n){
 if(n<1024)return n+" B";
 if(n<1048576)return (n/1024).toFixed(1)+" KB";
 return (n/1048576).toFixed(1)+" MB";
}
async function openFile(fid){
 let meta=dev().files.find(x=>x.id===fid);if(!meta)return;
 let f=await dbGet(fid);
 if(!f){notify("File data not found");return}
 if(meta.name.toLowerCase().endsWith(".apk")){
  go("file:"+fid);return;
 }
 let url=URL.createObjectURL(f.blob);
 objectUrls.push(url);
 go("file:"+fid);
}
async function fileView(fid){
 let meta=dev().files.find(x=>x.id===fid);
 if(!meta)return '<div class="p-5">File not found</div>';
 let f=await dbGet(fid);
 if(!f)return '<div class="p-5">File data not found</div>';
 let url=URL.createObjectURL(f.blob);objectUrls.push(url);
 let ext=meta.name.split(".").pop().toLowerCase();
 let content="";
 if(["jpg","jpeg","png","webp","gif"].includes(ext))
  content=`<img class="preview mx-auto" src="${url}">`;
 else if(["mp4","webm","mov","ogg"].includes(ext))
  content=`<video class="w-full" controls playsinline src="${url}"></video>`;
 else if(["mp3","wav","m4a","ogg"].includes(ext))
  content=`<audio class="w-full mt-8" controls src="${url}"></audio>`;
 else if(["txt","json","csv","html","css","js","md","xml"].includes(ext)){
  let text=await f.blob.text();
  content=`<pre class="text-xs whitespace-pre-wrap break-words">${esc(text.slice(0,100000))}</pre>`;
 }else if(ext==="pdf")
  content=`<iframe src="${url}" style="height:500px"></iframe>`;
 else if(ext==="apk")
  content=`<div class="text-center py-10">
   <div class="text-5xl">📦</div><h3 class="font-bold mt-4">APK Package</h3>
   <p class="muted mt-3">This file can be registered as a simulated app, but cannot be executed as Android software in a browser.</p>
   <button class="btn mt-5" onclick="registerAPK('${fid}')">Add to Home Screen</button>
  </div>`;
 else
  content=`<div class="text-center py-10">
   <div class="text-5xl">📄</div><p class="muted mt-3">Preview is not available for this file type.</p>
   <a class="btn inline-block mt-4" href="${url}" download="${esc(meta.name)}">Download File</a>
  </div>`;
 return `<div class="p-4 pt-7">
  <button class="text-blue-400 text-sm mb-5" onclick="back()">‹ Back to Files</button>
  <h2 class="font-bold text-lg mb-2 break-all">${esc(meta.name)}</h2>
  <p class="muted mb-5">${meta.sizeText}</p>
  <div class="card overflow-hidden">${content}</div>
  <button class="btn2 w-full mt-4" onclick="downloadFile('${fid}')">Download / Save</button>
 </div>`;
}
async function downloadFile(fid){
 let f=await dbGet(fid);if(!f)return;
 let url=URL.createObjectURL(f.blob);
 let a=document.createElement("a");a.href=url;a.download=f.name;
 a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function registerAPK(fid){
 let f=await dbGet(fid);if(!f)return;
 let name=f.name.replace(/\.apk$/i,"");
 if(dev().apps.some(a=>a.fileId===fid)){notify("Already added");return}
 dev().apps.push({id:id(),fileId:fid,name,icon:"📦",
  color:"#6d28d9",size:1,category:"Imported APK"});
 save();home();notify("APK shortcut added to Home");
}
