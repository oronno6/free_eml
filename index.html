<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Phone Emulator Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Top Bar: Device Selector & Auto DNS -->
    <header class="w-full max-w-4xl bg-slate-800 p-4 rounded-xl shadow-lg mb-6 flex flex-wrap justify-between items-center gap-4 border border-slate-700">
        <div class="flex items-center space-x-2">
            <label for="device-select" class="text-xs sm:text-sm text-slate-300 font-medium">Device Profile:</label>
            <select id="device-select" onchange="switchDevice()" class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-xs sm:text-sm focus:outline-none focus:border-emerald-500 text-white">
            </select>
            <button onclick="createNewDevice()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-md flex items-center gap-1.5 font-semibold transition active:scale-95">
                <i class="fa-solid fa-plus"></i> New Device
            </button>
        </div>

        <div class="flex items-center space-x-2">
            <span class="text-xs sm:text-sm font-medium mr-1"><i class="fa-solid fa-network-wired text-emerald-400"></i> DNS: <strong id="dns-status" class="text-emerald-400">Auto</strong></span>
            <select id="country" onchange="updateDNS()" class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-xs sm:text-sm focus:outline-none focus:border-emerald-500 text-white">
                <option value="us">United States (IP: 192.0.2.1)</option>
                <option value="uk">United Kingdom (IP: 198.51.100.1)</option>
                <option value="sg">Singapore (IP: 203.0.113.1)</option>
                <option value="de">Germany (IP: 212.58.244.1)</option>
            </select>
        </div>
    </header>

    <!-- Main Emulator Container (Phone Design) -->
    <main class="w-full max-w-xs bg-black rounded-[45px] p-3 shadow-2xl border-4 border-slate-700 relative flex flex-col items-center">
        <!-- Phone Camera Notch -->
        <div class="w-28 h-4 bg-slate-800 rounded-full mb-3 flex items-center justify-center">
            <div class="w-3 h-3 bg-slate-900 rounded-full"></div>
        </div>

        <!-- Phone Display Screen -->
        <div class="w-full h-[620px] bg-slate-950 rounded-[35px] overflow-hidden flex flex-col justify-between relative border border-slate-800 shadow-inner">
            
            <!-- Status Bar -->
            <div class="bg-slate-900/90 px-4 py-2 flex justify-between items-center text-xs text-slate-300 z-10 border-b border-slate-800">
                <span id="current-time" class="font-mono font-semibold">12:00 PM</span>
                <div class="flex items-center space-x-2">
                    <span id="device-name-display" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-emerald-400 font-medium">Device 1</span>
                    <i class="fa-solid fa-wifi text-slate-300"></i>
                    <i class="fa-solid fa-battery-full text-emerald-400"></i>
                </div>
            </div>

            <!-- Home Screen Apps Grid (Dynamic Apps Container) -->
            <div id="home-screen" class="p-5 grid grid-cols-3 gap-5 flex-grow content-start z-10 overflow-y-auto">
                
                <!-- Play Store -->
                <button onclick="openApp('playstore')" class="flex flex-col items-center group focus:outline-none active:scale-95 transition">
                    <div class="w-13 h-13 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-2xl p-3 flex items-center justify-center shadow-lg group-hover:scale-105 transition">
                        <i class="fa-brands fa-google-play text-2xl text-white"></i>
                    </div>
                    <span class="text-[10px] mt-1 text-slate-200 font-medium">Play Store</span>
                </button>

                <!-- Browser App -->
                <button onclick="openApp('browser')" class="flex flex-col items-center group focus:outline-none active:scale-95 transition">
                    <div class="w-13 h-13 bg-gradient-to-tr from-blue-600 to-cyan-400 rounded-2xl p-3 flex items-center justify-center shadow-lg group-hover:scale-105 transition">
                        <i class="fa-solid fa-globe text-2xl text-white"></i>
                    </div>
                    <span class="text-[10px] mt-1 text-slate-200 font-medium">Browser</span>
                </button>

                <!-- File Manager / Import App -->
                <button onclick="openApp('files')" class="flex flex-col items-center group focus:outline-none active:scale-95 transition">
                    <div class="w-13 h-13 bg-gradient-to-tr from-amber-500 to-orange-400 rounded-2xl p-3 flex items-center justify-center shadow-lg group-hover:scale-105 transition">
                        <i class="fa-solid fa-folder-open text-2xl text-white"></i>
                    </div>
                    <span class="text-[10px] mt-1 text-slate-200 font-medium">Files / APK</span>
                </button>

                <!-- Settings -->
                <button onclick="openApp('settings')" class="flex flex-col items-center group focus:outline-none active:scale-95 transition">
                    <div class="w-13 h-13 bg-gradient-to-tr from-slate-600 to-slate-500 rounded-2xl p-3 flex items-center justify-center shadow-lg group-hover:scale-105 transition">
                        <i class="fa-solid fa-gear text-2xl text-white"></i>
                    </div>
                    <span class="text-[10px] mt-1 text-slate-200 font-medium">Settings</span>
                </button>

                <!-- Dynamic installed apps/games will appear here -->
                <div id="installed-apps-grid" class="contents"></div>

            </div>

            <!-- Internal App View / Window Area -->
            <div id="app-view" class="absolute inset-0 bg-slate-950 hidden flex flex-col z-20">
                <div class="bg-slate-900 px-4 py-2.5 flex justify-between items-center border-b border-slate-800">
                    <span id="app-title" class="text-xs font-semibold text-white flex items-center gap-2">App</span>
                    <button onclick="closeApp()" class="text-slate-400 hover:text-white text-xs px-2 py-1 bg-slate-800 rounded transition"><i class="fa-solid fa-xmark"></i> Close</button>
                </div>
                <div id="app-content" class="flex-grow flex flex-col justify-center p-4 text-center overflow-y-auto">
                    <!-- Dynamic View Content -->
                </div>
            </div>

            <!-- Phone Navigation Bar -->
            <div class="bg-slate-900 py-3 flex justify-around items-center text-slate-400 text-sm z-10 border-t border-slate-800">
                <i class="fa-solid fa-chevron-left cursor-pointer hover:text-white transition active:scale-75" onclick="closeApp()" title="Back"></i>
                <i class="fa-solid fa-circle cursor-pointer hover:text-white transition active:scale-75" onclick="closeApp()" title="Home"></i>
                <i class="fa-solid fa-square cursor-pointer hover:text-white transition active:scale-75" onclick="alert('Virtual Task Manager: All services active')" title="Recent"></i>
            </div>
        </div>

        <div class="w-28 h-1 bg-slate-600 rounded-full mt-3"></div>
    </main>

    <footer class="mt-6 text-center text-xs text-slate-500">
        <p>Embedded Virtual Phone Environment. Multi-profile local persistence enabled.</p>
    </footer>

    <!-- App Logic Engine -->
    <script>
        let defaultGames = [
            { id: 'g1', name: 'Free Fire', icon: 'fa-fire', color: 'from-orange-600 to-red-500' },
            { id: 'g2', name: 'PUBG Mobile', icon: 'fa-crosshair', color: 'from-yellow-600 to-amber-500' },
            { id: 'g3', name: 'Subway Surfers', icon: 'fa-person-running', color: 'from-teal-500 to-emerald-400' },
            { id: 'g4', name: 'WhatsApp', icon: 'fa-comments', color: 'from-emerald-600 to-green-400' }
        ];

        let devices = JSON.parse(localStorage.getItem('emu_devices')) || [
            { id: 'dev_1', name: 'Device Profile 1', region: 'us', account: '', installedApps: [] }
        ];
        let activeDeviceId = localStorage.getItem('emu_active_device') || 'dev_1';

        document.addEventListener('DOMContentLoaded', () => {
            renderDeviceDropdown();
            loadActiveDevice();
            updateTime();
            setInterval(updateTime, 1000);
        });

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('current-time').innerText = `${hours}:${minutes} ${ampm}`;
        }

        function renderDeviceDropdown() {
            const select = document.getElementById('device-select');
            select.innerHTML = '';
            devices.forEach(dev => {
                const opt = document.createElement('option');
                opt.value = dev.id;
                opt.innerText = dev.name;
                if (dev.id === activeDeviceId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchDevice() {
            activeDeviceId = document.getElementById('device-select').value;
            localStorage.setItem('emu_active_device', activeDeviceId);
            loadActiveDevice();
            closeApp();
        }

        function loadActiveDevice() {
            const currentDev = devices.find(d => d.id === activeDeviceId) || devices[0];
            document.getElementById('device-name-display').innerText = currentDev.name;
            document.getElementById('country').value = currentDev.region;
            updateDNSStatus(currentDev.region);
            renderHomeApps();
        }

        function renderHomeApps() {
            const currentDev = devices.find(d => d.id === activeDeviceId);
            const grid = document.getElementById('installed-apps-grid');
            grid.innerHTML = '';
            
            if (currentDev && currentDev.installedApps) {
                currentDev.installedApps.forEach(app => {
                    const btn = document.createElement('button');
                    btn.className = "flex flex-col items-center group focus:outline-none active:scale-95 transition";
                    btn.onclick = () => runInstalledApp(app.name);
                    btn.innerHTML = `
                        <div class="w-13 h-13 bg-gradient-to-tr ${app.color || 'from-indigo-600 to-purple-500'} rounded-2xl p-3 flex items-center justify-center shadow-lg group-hover:scale-105 transition">
                            <i class="fa-solid ${app.icon || 'fa-gamepad'} text-2xl text-white"></i>
                        </div>
                        <span class="text-[10px] mt-1 text-slate-200 font-medium truncate w-14">${app.name}</span>
                    `;
                    grid.appendChild(btn);
                });
            }
        }

        function createNewDevice() {
            const newId = 'dev_' + Date.now();
            const newName = 'Device Profile ' + (devices.length + 1);
            const newDev = { id: newId, name: newName, region: 'us', account: '', installedApps: [] };
            
            devices.push(newDev);
            activeDeviceId = newId;
            
            localStorage.setItem('emu_devices', JSON.stringify(devices));
            localStorage.setItem('emu_active_device', activeDeviceId);
            
            renderDeviceDropdown();
            loadActiveDevice();
            closeApp();
        }

        function updateDNS() {
            const region = document.getElementById('country').value;
            const currentDev = devices.find(d => d.id === activeDeviceId);
            if (currentDev) {
                currentDev.region = region;
                localStorage.setItem('emu_devices', JSON.stringify(devices));
            }
            updateDNSStatus(region);
        }

        function updateDNSStatus(region) {
            const statusEl = document.getElementById('dns-status');
            statusEl.innerText = `Connecting (${region.toUpperCase()})...`;
            setTimeout(() => {
                statusEl.innerText = `${region.toUpperCase()} Active`;
            }, 300);
        }

        // Open Apps Routine
        function openApp(appName) {
            const appView = document.getElementById('app-view');
            const appTitle = document.getElementById('app-title');
            const appContent = document.getElementById('app-content');
            const currentDev = devices.find(d => d.id === activeDeviceId);

            appView.classList.remove('hidden');

            if (appName === 'playstore') {
                if (!currentDev.account) {
                    // Google Original Style Auth Page
                    appTitle.innerHTML = `<i class="fa-brands fa-google text-slate-200"></i> Google Account Sign-In`;
                    appContent.innerHTML = `
                        <div class="bg-white text-slate-900 rounded-2xl p-5 shadow-xl w-full max-w-xs text-left">
                            <div class="flex items-center gap-2 mb-3">
                                <i class="fa-brands fa-google text-red-500 text-2xl"></i>
                                <span class="font-bold text-slate-700 text-base">Sign in</span>
                            </div>
                            <p class="text-xs text-slate-600 mb-4">with your Google Account to access Google Play Store</p>
                            
                            <label class="block text-[11px] font-semibold text-slate-600 mb-1">Email or phone</label>
                            <input id="google-email" type="email" placeholder="example@gmail.com" class="w-full border border-slate-300 rounded px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-blue-600 mb-3">
                            
                            <label class="block text-[11px] font-semibold text-slate-600 mb-1">Password</label>
                            <input id="google-pass" type="password" placeholder="Enter password" class="w-full border border-slate-300 rounded px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-blue-600 mb-4">
                            
                            <button onclick="handleGoogleSignIn()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded text-xs transition shadow-md">Next & Sign In</button>
                        </div>
                    `;
                } else {
                    // Play Store Main Hub
                    appTitle.innerHTML = `<i class="fa-brands fa-google-play text-emerald-400"></i> Google Play Store`;
                    renderPlayStoreHub();
                }
            } else if (appName === 'browser') {
                appTitle.innerHTML = `<i class="fa-solid fa-globe text-blue-400"></i> Browser`;
                appContent.innerHTML = `
                    <div class="w-full h-full flex flex-col space-y-2">
                        <div class="flex items-center bg-slate-800 rounded p-1.5 border border-slate-700">
                            <i class="fa-solid fa-lock text-emerald-400 text-xs px-2"></i>
                            <span class="text-[11px] text-slate-300 truncate">https://www.google.com</span>
                        </div>
                        <div class="flex-grow bg-slate-800 text-slate-200 rounded p-3 text-xs flex flex-col items-center justify-center font-medium border border-slate-700">
                            <i class="fa-solid fa-shield-halved text-3xl text-emerald-400 mb-2"></i>
                            <span>Secure Cloud Sandbox Browser</span>
                        </div>
                    </div>
                `;
            } else if (appName === 'files') {
                appTitle.innerHTML = `<i class="fa-solid fa-folder-open text-amber-400"></i> File Manager / Import`;
                appContent.innerHTML = `
                    <div class="w-full text-left space-y-3 text-xs">
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-amber-400 mb-2"></i>
                            <p class="text-slate-200 font-semibold mb-1">Upload APK / Custom App File</p>
                            <p class="text-[10px] text-slate-400 mb-3">Select APK file from host system to install into emulator</p>
                            <input type="file" id="apk-file-input" class="hidden" onchange="handleFileImport(event)">
                            <button onclick="document.getElementById('apk-file-input').click()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded font-semibold transition">Select Device File</button>
                        </div>
                    </div>
                `;
            } else if (appName === 'settings') {
                appTitle.innerHTML = `<i class="fa-solid fa-gear text-slate-400"></i> Device Settings`;
                appContent.innerHTML = `
                    <div class="w-full text-left space-y-3 text-xs">
                        <div class="bg-slate-800 p-2.5 rounded border border-slate-700">
                            <span class="text-slate-400 block">Device Profile:</span>
                            <strong class="text-emerald-400">${currentDev.name}</strong>
                        </div>
                        <div class="bg-slate-800 p-2.5 rounded border border-slate-700">
                            <span class="text-slate-400 block">Logged Google Account:</span>
                            <strong class="text-blue-400">${currentDev.account || 'Not Authenticated'}</strong>
                        </div>
                        <button onclick="deleteDevice()" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-2 rounded font-semibold transition">Delete Profile</button>
                    </div>
                `;
            }
        }

        // Google Authentication Logic
        function handleGoogleSignIn() {
            const email = document.getElementById('google-email').value;
            const pass = document.getElementById('google-pass').value;

            if(!email || !pass) {
                alert('Please fill out both email and password.');
                return;
            }

            const currentDev = devices.find(d => d.id === activeDeviceId);
            if(currentDev) {
                currentDev.account = email;
                localStorage.setItem('emu_devices', JSON.stringify(devices));
                openApp('playstore');
            }
        }

        // Render Play Store Storefront
        function renderPlayStoreHub() {
            const appContent = document.getElementById('app-content');
            const currentDev = devices.find(d => d.id === activeDeviceId);

            let html = `
                <div class="w-full text-left space-y-3">
                    <div class="flex justify-between items-center bg-slate-800 p-2 rounded border border-slate-700">
                        <span class="text-[11px] text-slate-300 truncate"><i class="fa-solid fa-user-circle text-emerald-400"></i> ${currentDev.account}</span>
                        <button onclick="logoutAccount()" class="text-[10px] text-rose-400 hover:underline">Sign Out</button>
                    </div>

                    <p class="text-xs font-bold text-slate-200">Recommended Games & Apps:</p>
                    <div class="space-y-2">
            `;

            defaultGames.forEach(g => {
                const isInstalled = currentDev.installedApps && currentDev.installedApps.some(a => a.name === g.name);
                html += `
                    <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-xl border border-slate-800 shadow">
                        <div class="flex items-center gap-2.5">
                            <div class="w-9 h-9 rounded-lg bg-gradient-to-tr ${g.color} flex items-center justify-center">
                                <i class="fa-solid ${g.icon} text-white text-base"></i>
                            </div>
                            <span class="text-xs font-medium text-slate-200">${g.name}</span>
                        </div>
                        ${isInstalled 
                            ? `<button disabled class="bg-slate-700 text-slate-400 text-[10px] px-3 py-1 rounded font-medium">Installed</button>`
                            : `<button id="btn-${g.id}" onclick="installGame('${g.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] px-3 py-1 rounded font-semibold transition">Install</button>`
                        }
                    </div>
                `;
            });

            html += `</div></div>`;
            appContent.innerHTML = html;
        }

        // Play Store Game Installation Engine
        function installGame(gameId) {
            const game = defaultGames.find(g => g.id === gameId);
            const btn = document.getElementById(`btn-${gameId}`);
            if(!game || !btn) return;

            btn.disabled = true;
            btn.innerText = "Downloading 0%";
            let progress = 0;

            const interval = setInterval(() => {
                progress += 25;
                btn.innerText = `Installing ${progress}%`;
                if(progress >= 100) {
                    clearInterval(interval);
                    
                    const currentDev = devices.find(d => d.id === activeDeviceId);
                    if(currentDev) {
                        if(!currentDev.installedApps) currentDev.installedApps = [];
                        currentDev.installedApps.push(game);
                        localStorage.setItem('emu_devices', JSON.stringify(devices));
                        renderHomeApps();
                        renderPlayStoreHub();
                        alert(`${game.name} successfully installed to Gaming Home Screen!`);
                    }
                }
            }, 300);
        }

        // Custom File Import
        function handleFileImport(event) {
            const file = event.target.files[0];
            if(file) {
                const currentDev = devices.find(d => d.id === activeDeviceId);
                if(currentDev) {
                    if(!currentDev.installedApps) currentDev.installedApps = [];
                    currentDev.installedApps.push({
                        id: 'custom_' + Date.now(),
                        name: file.name,
                        icon: 'fa-cube',
                        color: 'from-purple-600 to-indigo-500'
                    });
                    localStorage.setItem('emu_devices', JSON.stringify(devices));
                    renderHomeApps();
                    alert(`APK "${file.name}" imported and installed!`);
                    closeApp();
                }
            }
        }

        function runInstalledApp(appName) {
            const appView = document.getElementById('app-view');
            const appTitle = document.getElementById('app-title');
            const appContent = document.getElementById('app-content');

            appView.classList.remove('hidden');
            appTitle.innerHTML = `<i class="fa-solid fa-gamepad text-emerald-400"></i> ${appName}`;
            appContent.innerHTML = `
                <div class="flex flex-col items-center justify-center space-y-3 h-full">
                    <div class="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-3xl animate-bounce">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <h3 class="text-sm font-bold text-slate-100">${appName} Sandbox Running</h3>
                    <p class="text-[11px] text-slate-400 max-w-xs">Virtual Game Instance loaded in Cloud Phone Sandbox Environment.</p>
                </div>
            `;
        }

        function logoutAccount() {
            const currentDev = devices.find(d => d.id === activeDeviceId);
            if (currentDev) {
                currentDev.account = '';
                localStorage.setItem('emu_devices', JSON.stringify(devices));
                openApp('playstore');
            }
        }

        function deleteDevice() {
            if (devices.length <= 1) {
                alert('You must keep at least one device profile!');
                return;
            }
            devices = devices.filter(d => d.id !== activeDeviceId);
            activeDeviceId = devices[0].id;
            localStorage.setItem('emu_devices', JSON.stringify(devices));
            localStorage.setItem('emu_active_device', activeDeviceId);
            closeApp();
            renderDeviceDropdown();
            loadActiveDevice();
        }

        function closeApp() {
            document.getElementById('app-view').classList.add('hidden');
        }
    </script>
</body>
</html>
